<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infinite Virtual Scroll — Windowed List</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Ctext x='16' y='23' font-size='19' font-weight='700' text-anchor='middle' fill='white' font-family='system-ui,sans-serif'%3EI%3C/text%3E%3C/svg%3E">
  <meta name="description" content="An infinite virtual scroller that renders only the visible rows so huge lists stay fast." />
  <meta name="foundry:category" content="DOM & UI" />
  <meta name="foundry:difficulty" content="Intermediate" />
  <meta name="foundry:tags" content="virtual-scroll,intersection-observer,performance,dom,infinite-scroll" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="foundry-back" href="../../">← Foundry</a>
  <noscript><p class="foundry-noscript">This project needs JavaScript. Please enable it in your browser to continue.</p></noscript>
  <h1 class="sr-only">Infinite virtual scroll list</h1>
  <div class="app">

    <header class="topbar">
      <div class="topbar-left">
        <div class="logo">
          <svg class="logo-icon" viewBox="0 0 20 22" fill="none">
            <rect x="1" y="1"  width="18" height="4" rx="1.5" fill="currentColor"/>
            <rect x="1" y="7"  width="18" height="4" rx="1.5" fill="currentColor" opacity="0.55"/>
            <rect x="1" y="13" width="18" height="4" rx="1.5" fill="currentColor" opacity="0.25"/>
            <rect x="1" y="19" width="11" height="2" rx="1"   fill="currentColor" opacity="0.12"/>
          </svg>
          <span class="logo-name">Infinite virtual scroll</span>
        </div>
        <span class="chip">1,000,000 entries</span>
      </div>
      <div class="topbar-stats">
        <div class="ts">
          <span class="ts-l">DOM NODES</span>
          <span class="ts-v" id="sRendered">—</span>
        </div>
        <div class="ts-sep"></div>
        <div class="ts">
          <span class="ts-l">ROW INDEX</span>
          <span class="ts-v" id="sRow">—</span>
        </div>
        <div class="ts-sep"></div>
        <div class="ts">
          <span class="ts-l">SCROLL PX</span>
          <span class="ts-v" id="sOffset">0</span>
        </div>
        <div class="ts-sep"></div>
        <div class="ts">
          <span class="ts-l">PROGRESS</span>
          <span class="ts-v" id="sProgress">0.000%</span>
        </div>
      </div>
    </header>

    <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>

    <div class="col-head">
      <span class="ch ch-id">ID</span>
      <span class="ch ch-status">STATUS</span>
      <span class="ch ch-title">TITLE</span>
      <span class="ch ch-cat">CATEGORY</span>
      <span class="ch ch-user">USER</span>
      <span class="ch ch-time">TIME</span>
    </div>

    <div class="scroll-wrap" id="scrollWrap">
      <div class="scroll-inner" id="scrollInner">
        <div id="spacerTop"></div>
        <div id="rowPool"></div>
        <div id="spacerBottom"></div>
      </div>
    </div>

  </div>
  <script src="script.js"></script>
</body>
</html>
