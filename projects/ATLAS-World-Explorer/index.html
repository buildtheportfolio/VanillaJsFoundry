<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas — World Countries Explorer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d9488'/%3E%3Ctext x='16' y='23' font-size='19' font-weight='700' text-anchor='middle' fill='white' font-family='system-ui,sans-serif'%3EA%3C/text%3E%3C/svg%3E">
    <meta
      name="description"
      content="Explore every country in the world with live REST Countries data: search, filter, compare and browse flags, capitals, languages and currencies."
    />
    <meta name="foundry:category" content="APIs & Async" />
    <meta name="foundry:difficulty" content="Intermediate" />
    <meta
      name="foundry:tags"
      content="rest-api,fetch,countries,search,offline-cache"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
  <a class="foundry-back" href="../../">← Foundry</a>
  <noscript><p class="foundry-noscript">This project needs JavaScript. Please enable it in your browser to continue.</p></noscript>
    <div class="shell">
      <header class="topbar">
        <h1 class="logo">ATLAS <span>World Explorer</span></h1>
        <div class="topbar-search">
          <span class="icon">🔍</span>
          <input
            type="text"
            id="globalSearch"
            placeholder="Search any country…"
            autocomplete="off"
          />
        </div>
        <div class="topbar-right">
          <span class="tag">v3.1 API</span>
          <span class="tag" id="countryCountBadge">250+ countries</span>
        </div>
      </header>

      <nav class="sidebar">
        <div class="sidebar-section">
          <div class="sidebar-label">Explore</div>
          <button
            class="nav-item active"
            data-page="home"
            onclick="navigate('home')"
          >
            <span class="ni-icon">🌍</span> Home
          </button>
          <button class="nav-item" data-page="all" onclick="navigate('all')">
            <span class="ni-icon">📋</span> All Countries
            <span class="ni-badge" id="allBadge">–</span>
          </button>
          <button
            class="nav-item"
            data-page="regions"
            onclick="navigate('regions')"
          >
            <span class="ni-icon">🗺️</span> By Region
          </button>
        </div>

        <div class="sidebar-divider"></div>

        <div class="sidebar-section">
          <div class="sidebar-label">Search APIs</div>
          <button
            class="nav-item"
            data-page="byName"
            onclick="navigate('byName')"
          >
            <span class="ni-icon">🔤</span> By Name
          </button>
          <button
            class="nav-item"
            data-page="byCode"
            onclick="navigate('byCode')"
          >
            <span class="ni-icon">#️⃣</span> By Code
          </button>
          <button
            class="nav-item"
            data-page="byCurrency"
            onclick="navigate('byCurrency')"
          >
            <span class="ni-icon">💱</span> By Currency
          </button>
          <button
            class="nav-item"
            data-page="byLanguage"
            onclick="navigate('byLanguage')"
          >
            <span class="ni-icon">💬</span> By Language
          </button>
          <button
            class="nav-item"
            data-page="byCapital"
            onclick="navigate('byCapital')"
          >
            <span class="ni-icon">🏛️</span> By Capital
          </button>
          <button
            class="nav-item"
            data-page="byDemonym"
            onclick="navigate('byDemonym')"
          >
            <span class="ni-icon">👤</span> By Demonym
          </button>
          <button
            class="nav-item"
            data-page="byTranslation"
            onclick="navigate('byTranslation')"
          >
            <span class="ni-icon">🌐</span> By Translation
          </button>
        </div>

        <div class="sidebar-divider"></div>

        <div class="sidebar-section">
          <div class="sidebar-label">Advanced</div>
          <button
            class="nav-item"
            data-page="independent"
            onclick="navigate('independent')"
          >
            <span class="ni-icon">🏳️</span> Independent Status
          </button>
          <button
            class="nav-item"
            data-page="fieldFilter"
            onclick="navigate('fieldFilter')"
          >
            <span class="ni-icon">⚙️</span> Field Filter
          </button>
          <button
            class="nav-item"
            data-page="compare"
            onclick="navigate('compare')"
          >
            <span class="ni-icon">⚖️</span> Compare Countries
          </button>
          <button
            class="nav-item"
            data-page="multiCode"
            onclick="navigate('multiCode')"
          >
            <span class="ni-icon">📦</span> Multi-Code Lookup
          </button>
        </div>
      </nav>

      <main class="main" id="mainContent"></main>
    </div>

    <div class="modal-overlay" id="modal">
      <div class="modal" id="modalContent"></div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
  </body>
</html>
