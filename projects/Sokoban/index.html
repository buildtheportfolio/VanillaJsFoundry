<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sokoban — Push the Crates</title>
  <meta name="description" content="Classic crate-pushing puzzle with 24 verified-solvable levels, undo/redo, swipe and keyboard controls, and saved progress.">
  <meta name="foundry:category" content="Games">
  <meta name="foundry:difficulty" content="Intermediate">
  <meta name="foundry:tags" content="puzzle,grid,undo-redo,touch,localStorage">
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Sokoban</h1>
      <p class="sub">Push every crate onto a goal. You can only push, never pull.</p>
    </header>

    <section class="hud" aria-label="Level status">
      <div class="stat"><span class="k">Level</span><span class="v" id="levelNum">1</span></div>
      <div class="stat"><span class="k">Moves</span><span class="v" id="moves">0</span></div>
      <div class="stat"><span class="k">Pushes</span><span class="v" id="pushes">0</span></div>
      <div class="stat"><span class="k">Best</span><span class="v" id="best">&ndash;</span></div>
    </section>

    <div class="board-wrap" id="boardWrap">
      <div class="board" id="board" role="img" aria-label="Sokoban board"></div>
      <div class="win" id="win" hidden>
        <p class="win-title">Level cleared!</p>
        <p id="winText"></p>
        <div class="row">
          <button type="button" id="winNext" class="primary">Next level</button>
          <button type="button" id="winAgain">Replay</button>
        </div>
      </div>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <div class="controls">
      <button type="button" id="undo" title="Undo (Z)">Undo</button>
      <button type="button" id="redo" title="Redo (Y)">Redo</button>
      <button type="button" id="restart" title="Restart (R)">Restart</button>
    </div>

    <div class="pad" aria-label="On-screen directional pad">
      <button type="button" class="p-up" data-dir="up" aria-label="Move up">&#9650;</button>
      <button type="button" class="p-left" data-dir="left" aria-label="Move left">&#9664;</button>
      <button type="button" class="p-down" data-dir="down" aria-label="Move down">&#9660;</button>
      <button type="button" class="p-right" data-dir="right" aria-label="Move right">&#9654;</button>
    </div>

    <p class="help">Arrows / WASD to move &middot; Z undo &middot; Y redo &middot; R restart &middot; swipe on the board on touch screens.</p>

    <section class="levels" aria-labelledby="lvTitle">
      <h2 id="lvTitle">Levels <span id="progress" class="muted"></span></h2>
      <div class="grid" id="levelGrid"></div>
      <button type="button" id="resetProgress" class="link">Reset saved progress</button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
