<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finite SaaS Onboarding — State-Machine Wizard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d9488'/%3E%3Ctext x='16' y='23' font-size='19' font-weight='700' text-anchor='middle' fill='white' font-family='system-ui,sans-serif'%3EF%3C/text%3E%3C/svg%3E">
    <meta
      name="description"
      content="A multi-step SaaS onboarding wizard driven by an explicit finite state machine with guards, branching transitions, history integration and a live inspector."
    />
    <meta name="foundry:category" content="DOM &amp; UI" />
    <meta name="foundry:difficulty" content="Intermediate" />
    <meta
      name="foundry:tags"
      content="state-machine,wizard,forms,history-api,validation"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
  <a class="foundry-back" href="../../">← Foundry</a>
  <noscript><p class="foundry-noscript">This project needs JavaScript. Please enable it in your browser to continue.</p></noscript>
    <div class="shell">
      <header class="top">
        <div>
          <p class="eyebrow">Finite state machine demo</p>
          <h1>Finite SaaS Onboarding</h1>
          <p class="lede">
            A wizard whose every move is a declared transition. Demo only:
            nothing you type is sent anywhere.
          </p>
        </div>
        <button type="button" class="btn ghost" id="startOver">Start over</button>
      </header>

      <section class="resume" id="resume" aria-label="Resume saved progress" hidden>
        <p id="resumeText"></p>
        <div class="resume-actions">
          <button type="button" class="btn primary" id="resumeBtn">Resume where you left off</button>
          <button type="button" class="btn ghost" id="resumeReset">Start over</button>
        </div>
      </section>

      <nav class="stepper-wrap" aria-label="Onboarding steps">
        <ol class="stepper" id="stepper"></ol>
        <p class="skip-note" id="skipNote" hidden></p>
      </nav>

      <div class="progress">
        <div
          class="bar"
          id="bar"
          role="progressbar"
          aria-label="Onboarding progress"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div class="bar-fill" id="barFill"></div>
        </div>
        <p class="bar-label" id="barLabel"></p>
      </div>

      <main class="card" id="main">
        <p class="notice" id="notice" hidden></p>
        <form id="wizard" novalidate>
          <div id="stepHost"></div>
        </form>
      </main>

      <p class="sr-status" id="status" role="status" aria-live="polite"></p>

      <details class="inspector" id="inspector">
        <summary>Machine inspector</summary>
        <div class="insp-body">
          <dl class="insp-meta" id="inspMeta"></dl>
          <h2 class="insp-h">Events and guards</h2>
          <ul class="insp-events" id="inspEvents"></ul>
          <h2 class="insp-h">Transition log</h2>
          <ol class="insp-log" id="inspLog"></ol>
        </div>
      </details>

      <p class="kbd-help">
        Keyboard: <kbd>Enter</kbd> continue, <kbd>Alt</kbd>+<kbd>←</kbd> back,
        <kbd>Alt</kbd>+<kbd>→</kbd> next.
      </p>
    </div>
    <script src="script.js"></script>
  </body>
</html>
