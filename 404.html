<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Page not found. Head back to the Vanilla JS Foundry project hub.">
  <meta name="color-scheme" content="light dark">
  <title>Page not found | Vanilla JS Foundry</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4ed8'/%3E%3Ctext x='16' y='23' font-size='19' font-weight='700' text-anchor='middle' fill='white' font-family='system-ui,sans-serif'%3EF%3C/text%3E%3C/svg%3E">
  <!-- Styles are inline on purpose: GitHub Pages serves this file at ANY depth, so relative stylesheet paths would break. -->
  <style>
    :root { color-scheme: light dark; --bg: #f7f7f5; --text: #171717; --muted: #565656; --accent: #1d4ed8; --border: #d4d4d0; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f1115; --text: #ececec; --muted: #a8afbb; --accent: #8ab4ff; --border: #343a46; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.5; }
    main { width: min(560px, 100%); padding: 32px; border: 1px solid var(--border); border-radius: 16px; text-align: center; }
    .code { margin: 0; font-size: clamp(56px, 16vw, 96px); font-weight: 800; line-height: 1; color: var(--accent); }
    h1 { margin: 8px 0 12px; font-size: clamp(22px, 5vw, 30px); }
    p { margin: 0 0 20px; color: var(--muted); }
    a.btn { display: inline-block; min-height: 44px; padding: 11px 22px; border-radius: 10px; background: var(--accent); color: var(--bg); font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>This page wandered off.</h1>
    <p>The page you were looking for doesn't exist, or the project was renamed.</p>
    <a id="home" class="btn" href="./">Back to the Foundry hub</a>
    <noscript><p style="margin-top:16px">If the button above doesn't land on the hub, remove everything after the repository name in the address bar.</p></noscript>
  </main>
  <script>
    // A 404 page can be served from any depth, so work out the hub's base path at runtime.
    (function () {
      var path = window.location.pathname;
      var i = path.indexOf('/projects/');
      var base;
      if (i >= 0) base = path.slice(0, i + 1);
      else if (/\.github\.io$/.test(window.location.hostname)) base = '/' + (path.split('/')[1] || '') + (path.split('/')[1] ? '/' : '');
      else base = path.slice(0, path.lastIndexOf('/') + 1) || '/';
      document.getElementById('home').setAttribute('href', base);
    })();
  </script>
</body>
</html>
