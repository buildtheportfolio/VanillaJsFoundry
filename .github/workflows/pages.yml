name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so projects.json "updated" dates come from git

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build projects.json
        run: node scripts/build-projects.mjs

      - name: Validate projects
        run: node scripts/validate.mjs

      - name: Assemble site artifact
        run: |
          mkdir _site
          cp index.html style.css script.js projects.json 404.html .nojekyll _site/
          cp -r projects _site/projects

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
