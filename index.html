<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A hub of small, self-contained Vanilla JavaScript projects.">
  <title>Vanilla JS Foundry</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="shell">
      <p class="eyebrow">BUILD THE PORTFOLIO</p>
      <h1>Vanilla JS Foundry</h1>
      <p class="intro">A growing collection of small, self-contained projects built with plain HTML, CSS and JavaScript.</p>
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search projects..." autocomplete="off">
        <span id="count" class="count"></span>
      </div>
    </div>
  </header>

  <main class="shell">
    <section id="projects" class="projects" aria-live="polite"></section>
    <p id="status" class="status">Loading projects…</p>
  </main>

  <footer class="shell footer">
    <span>Vanilla HTML · CSS · JavaScript</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
